# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Theme Settings
minimal_mistakes_skin    : "contrast" # bold, modern look

# Site Settings
locale                   : "en-US"
direction                :
title                    : "Omar Tamer"
title_separator          : "-"
subtitle                 : "Cloud & DevOps Engineer"
name                     : "Omar Tamer"
description              : "Notes and write-ups on Kubernetes, CI/CD, Terraform, and cloud infrastructure from a DevOps engineer working across AWS, GCP, and on-prem systems."
url                      : "https://omartamer630.github.io"
baseurl                  :
repository               : "omartamer630/omartamer630.github.io"
teaser                   :
logo                     :
masthead_title           :
breadcrumbs              : true
words_per_minute          : 200
enable_copy_code_button  : true
copyright                :
copyright_url            :
comments:
  provider               : "utterances" # lightweight, free, GitHub-issues-based comments
  utterances:
    theme                : "github-dark"
    issue_term           : "pathname"

reCaptcha:
  siteKey                :
  secret                 :
atom_feed:
  path                   :
  hide                   :
search                   : true
search_full_content      : true
search_provider          : lunr
lunr:
  search_within_pages    : true

# SEO Related
google_site_verification :
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

# Social Sharing
twitter:
  username               :
facebook:
  username                :
  app_id                  :
  publisher                :
og_image                 :
og_image_alt              :
social:
  type                    : "Person"
  name                     : "Omar Tamer"
  links:
    - "https://github.com/omartamer630"
    - "https://www.linkedin.com/in/omar-tamer03"
    - "https://omar-blogs.hashnode.dev"

# Analytics
analytics:
  provider                : false
  google:
    tracking_id           :
    anonymize_ip          :

# Site Author
author:
  name             : "Omar Tamer"
  avatar           :
  bio              : "Cloud & DevOps Engineer specializing in Kubernetes, CI/CD automation, and Infrastructure as Code. I write about building reliable, scalable infrastructure on AWS, GCP, and hybrid environments."
  location         : "Cairo, Egypt"
  email            : "omartamerdev@gmail.com"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-square-envelope"
      url: "mailto:omartamerdev@gmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/omartamer630"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/omar-tamer03"
    - label: "Hashnode Blog"
      icon: "fas fa-fw fa-link"
      url: "https://omar-blogs.hashnode.dev"

# Site Footer
footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-square-envelope"
      url: "mailto:omartamerdev@gmail.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/omartamer630"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/omar-tamer03"
  since: "2026"


# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - minimal-mistakes-jekyll.gemspec
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs
  - /test
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations: ['import']


# Outputting
permalink: /:categories/:title/
timezone: Africa/Cairo


# Pagination with jekyll-paginate
paginate: 5
paginate_path: /page:num/

pagination:
  debug: false
  collection: 'posts'
  per_page: 10
  permalink: '/page/:num/'
  title: ':title - page :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true
  category: 'posts'
  tag: ''
  locale: ''
  trail:
    before: 2
    after: 2


# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache


# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/


# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development


# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
